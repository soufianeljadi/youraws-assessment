version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: youraws-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: youraws_db
      MYSQL_USER: youraws_user
      MYSQL_PASSWORD: youraws_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - youraws-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Backend API
  backend:
    build: ./backend
    container_name: youraws-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: youraws_user
      DB_PASSWORD: youraws_password
      DB_NAME: youraws_db
      PORT: 3000
      NODE_ENV: production
      CORS_ORIGIN: "*"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - youraws-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      timeout: 10s
      retries: 5

  # Frontend with Nginx
  frontend:
    build: ./frontend
    container_name: youraws-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - youraws-network
    environment:
      REACT_APP_API_URL: /api

networks:
  youraws-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
